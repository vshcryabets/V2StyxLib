; https://docs.platformio.org/page/projectconf.html

[env:stm8s003f3]
platform = ststm8
board = stm8s003f3
framework = spl
build_flags = 
    -I include
    --opt-code-size
    --std-sdcc11
    -DSTM8S003F3
    -DV2STYXLIB_SOFTUART_TX
    -DV2STYXLIB_TARGET_STM8

lib_extra_dirs = ../../c/
lib_deps =
     V2StyxLibL4_C

